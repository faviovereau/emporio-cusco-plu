<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EMPORIO CUSCO SPA</title>

<!-- BARCODE -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
/* ===== BASE ===== */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  font-family:'Inter', Arial, Helvetica, sans-serif;
  margin:0;
  background:
    radial-gradient(circle at 50% 140px, rgba(122,31,43,.18), transparent 55%),
    linear-gradient(180deg, #f6f7f9 0%, #eceff3 100%);
}

.wrap{min-height:100dvh;display:flex;flex-direction:column;}

/* ===== LOGIN (INTOCABLE) ===== */
#login{
  background:linear-gradient(160deg,#fff,#f4f4f4);
  padding:22px;border-radius:22px;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}
.login-row{display:flex;gap:12px;}
#login input{flex:1;padding:16px;border-radius:16px;border:1px solid #ddd;font-size:17px;}
#login button{padding:16px;border-radius:16px;border:0;background:#7a1f2b;color:#fff;touch-action:manipulation;}
.login-brand{text-align:center;margin-top:20px;color:#777;}
body:has(#login:not([style*="display: none"])) .wrap{justify-content:center;align-items:center;}

/* ===== APP ===== */
#app{display:none;height:100dvh;}
.app-header{
  position:sticky;top:0;z-index:10;
  max-width:92%;margin:14px auto;
  background:#e6e5e1;padding:14px;
  text-align:center;font-weight:700;border-radius:18px;
}

/* ===== BUSCADOR ===== */
.search-container{
  position:sticky;top:72px;z-index:9;
  max-width:82%;margin:0 auto 18px;
  padding:22px 18px 26px;
  background:linear-gradient(160deg,#7a1f2b,#641823 60%,#56131c);
  border-radius:30px;
}
.search-box{
  display:flex;align-items:center;
  background:#fff;border-radius:999px;
  padding:18px 22px;
}
.search-icon{margin-right:14px;}
.search-box input{border:0;outline:none;font-size:17px;width:100%;}

/* ===== RESULTADOS ===== */
.results{
  max-width:82%;margin:0 auto;
  height:calc(100dvh - 230px);
  overflow-y:auto;padding:16px;
  touch-action:manipulation;
}
.item{
  background:#fff;border-radius:18px;
  padding:18px;margin-bottom:16px;
  box-shadow:0 8px 18px rgba(0,0,0,.14);
  cursor:pointer;
  touch-action:manipulation;
}
.item:active{transform:scale(.98);background:#f7f7f7;}
.code{font-size:26px;font-weight:800;color:#7a1f2b;}
.name{font-weight:700;}
.price{color:#666;}

/* ===== BARCODE OVERLAY ===== */
#overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  display:none;align-items:center;justify-content:center;
  z-index:999;
  touch-action:manipulation;
}
.barcode-card{
  background:#fff;
  padding:24px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.45);
}
.barcode-code{
  font-size:20px;
  font-weight:800;
  color:#7a1f2b;
  margin-bottom:12px;
}
</style>
</head>

<body>
<div class="wrap">

<!-- LOGIN -->
<div id="login">
  <div class="login-row">
    <input id="pwd" type="password" placeholder="Contraseña">
    <button onclick="auth()">Entrar</button>
  </div>
  <div class="login-brand">EMPORIO CUSCO SPA</div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">EMPORIO CUSCO SPA</div>

  <div class="search-container">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="q" placeholder="Buscar producto o código">
    </div>
  </div>

  <div id="res" class="results" onclick="onResultsTap(event)"></div>
</div>

<!-- BARCODE -->
<div id="overlay" onclick="onOverlayTap(event)">
  <div class="barcode-card">
    <div id="barcodeText" class="barcode-code"></div>
    <svg id="barcode"></svg>
  </div>
</div>

<script>
const PASSWORD="admin2026@";
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQFNKacvGEXGdsn5IkcjYgdW8nBIM1UFZL5sjhxPa9JDJnn3DA962sjDaJ9bv1aGA/pub?gid=915072749&single=true&output=csv";
let DATA=[];

function auth(){
  if(pwd.value===PASSWORD){
    login.style.display="none";
    app.style.display="block";
  }else alert("Contraseña incorrecta");
}

function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

/* ===== DOBLE-TAP MANUAL =====
   dblclick nativo no es confiable en móvil, sobre todo con
   touch-action:manipulation (que ya no sintetiza dblclick).
   Medimos el tiempo entre dos clics/taps sobre el mismo elemento. */
const tapMap=new WeakMap();
const DOUBLE_TAP_MS=350;

function isDoubleTap(key){
  const now=Date.now();
  const last=tapMap.get(key)||0;
  tapMap.set(key,now);
  return (now-last)<DOUBLE_TAP_MS;
}

function onItemTap(el,ev){
  if(isDoubleTap(el)){
    ev.stopPropagation();
    fillSearch(el,ev);
  }
}

function onResultsTap(ev){
  if(ev.target.closest(".item"))return; // el item ya maneja su propio doble-tap
  if(isDoubleTap(res)) clearSearch();
}

function onOverlayTap(ev){
  if(isDoubleTap(overlay)) closeBarcode();
}

function fillSearch(el,ev){
  q.value=el.dataset.nombre;
  q.dispatchEvent(new Event("input"));
  q.focus();

  const code=el.dataset.codigo;
  if(code.length>=6) showBarcode(code);
}

function clearSearch(){
  q.value="";
  res.innerHTML="";
  q.focus();
}

function showBarcode(code){
  overlay.style.display="flex";
  barcodeText.textContent=code;
  JsBarcode("#barcode", code, {format:"CODE128",width:2,height:80});
}

function closeBarcode(){
  overlay.style.display="none";
}

// Parseo de CSV que respeta comas dentro de comillas (ej: "Arroz, 1kg")
function parseCSVLine(line){
  const result=[];
  let cur="";
  let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      inQuotes=!inQuotes;
    }else if(ch===','&&!inQuotes){
      result.push(cur.trim());
      cur="";
    }else{
      cur+=ch;
    }
  }
  result.push(cur.trim());
  return result;
}

fetch(CSV_URL)
.then(r=>r.text())
.then(t=>{
  const [_,...rows]=t.trim().split("\n");
  DATA=rows.map(r=>{
    const c=parseCSVLine(r);
    return {codigo:c[0],nombre:c[1],precio:c[2]};
  });
});

q.addEventListener("input",()=>{
  const k=norm(q.value);
  res.innerHTML="";
  if(!k)return;

  DATA.filter(x=>norm(x.nombre).includes(k)||x.codigo.includes(q.value))
  .slice(0,20)
  .forEach(x=>{
    res.innerHTML+=`
    <div class="item"
      onclick="onItemTap(this,event)"
      data-nombre="${x.nombre}"
      data-codigo="${x.codigo}">
      <div class="code">${x.codigo}</div>
      <div class="name">${x.nombre}</div>
      <div class="price">$${x.precio}</div>
    </div>`;
  });
});
</script>

</body>
</html>
